name: Upload Python Package

on:
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        working-directory: backend
        run: |
          python -m pip install --upgrade pip build
          python -m build
